<!doctype html>
<html><head><title>zoo hover menu</title>
<style>#main-menu .submenu { display: none; } #main-menu.open .submenu { display: block; }</style>
</head>
<body>
<h1 id="page-title">Menu</h1>
<nav id="main-menu"><button id="menu-btn" type="button">Products</button>
<ul class="submenu"><li><a id="sub-widgets" href="#widgets">Widgets</a></li><li><a id="sub-gadgets" href="#gadgets">Gadgets</a></li></ul>
</nav>
<p id="menu-echo"></p>
<script>
var nav = document.getElementById('main-menu');
document.getElementById('menu-btn').addEventListener('mouseenter', function () { nav.classList.add('open'); });
document.getElementById('sub-widgets').addEventListener('click', function () {
  document.getElementById('menu-echo').textContent = 'menu picked: Widgets';
});
</script>
</body></html>
