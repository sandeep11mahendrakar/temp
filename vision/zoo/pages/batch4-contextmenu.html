<!doctype html>
<html><head><title>zoo contextmenu</title></head>
<body>
<h1 id="page-title">Context Menu</h1>
<div id="ctx-target" style="width:200px;height:100px;border:1px solid #000;">Right-click here</div>
<div id="ctx-menu" style="display:none;">Copy | Paste | Delete</div>
<script>
document.getElementById('ctx-target').addEventListener('contextmenu', function(e){
  e.preventDefault();
  document.getElementById('ctx-menu').style.display = 'block';
});
</script>
</body></html>
